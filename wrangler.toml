name = "ai-crawler-audit"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Lead storage + rate limiting.
# Create it once:  npx wrangler kv namespace create LEADS
# then paste the returned id below.
[[kv_namespaces]]
binding = "LEADS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Optional. Any endpoint that accepts a JSON POST works:
# ClickFunnels webhook, GoHighLevel inbound webhook, Zapier/Make catch hook, n8n.
# Set it as a secret instead if you prefer:  npx wrangler secret put LEAD_WEBHOOK_URL
LEAD_WEBHOOK_URL = ""

# Custom domain (optional). Uncomment and point at a zone you control.
# [[routes]]
# pattern = "crawlercheck.yourdomain.com"
# custom_domain = true
