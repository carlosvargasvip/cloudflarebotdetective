name = "ai-crawler-audit"
main = "src/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Scan results (scan:<id>, 30-day TTL) + rate-limit counters (rl:<ip>:<window>).
# Leads are captured by the ClickFunnels SDK, not stored here.
[[kv_namespaces]]
binding = "KV"
id = "f7578d05b1094b1689e807383e562ac4"

# Atomic per-IP burst limiter: 6 scans / 60s. The KV counter in rateLimit()
# keeps the longer 12-per-10-minutes window.
[[unsafe.bindings]]
name = "SCAN_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Custom domain (optional). Uncomment and point at a zone you control.
# [[routes]]
# pattern = "crawlercheck.yourdomain.com"
# custom_domain = true
